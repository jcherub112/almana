name = "almana-inquiry"
main = "worker.js"
compatibility_date = "2026-01-01"

# Email Routing binding: lets the Worker send to a verified destination address
send_email = [
  { name = "INQUIRY_EMAIL", destination_address = "info@almanarecovery.com" }
]

# Custom hostname on the almanarecovery.com zone
routes = [
  { pattern = "form.almanarecovery.com/*", zone_name = "almanarecovery.com" }
]
